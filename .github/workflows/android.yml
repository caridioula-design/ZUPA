name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # chaque lundi : pharmacies actualisées + nouvel APK

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZUPA_BUILD: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ZUPA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dépendances
        run: npm ci

      - name: Pharmacies d'Abidjan (OpenStreetMap)
        run: node scripts/fetch-pharmacies.mjs
        continue-on-error: true

      - name: Enregistrer les pharmacies actualisées dans le dépôt
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- www/data/pharmacies.js; then
            git config user.name "zupa-bot"
            git config user.email "zupa-bot@users.noreply.github.com"
            git add www/data/pharmacies.js
            git commit -m "Pharmacies : mise à jour OpenStreetMap"
            git push || echo "Push impossible (branche protégée ?) : données utilisées pour cet APK seulement"
          fi

      - name: Copier l'application web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/ZUPA-${VERSION}-build${ZUPA_BUILD}.apk"

      - name: Compiler la version signée (si la clé est configurée)
        if: env.KEYSTORE_B64 != ''
        env:
          ZUPA_KEYSTORE_PASSWORD: ${{ secrets.ZUPA_KEYSTORE_PASSWORD }}
          ZUPA_KEY_ALIAS: ${{ secrets.ZUPA_KEY_ALIAS }}
          ZUPA_KEY_PASSWORD: ${{ secrets.ZUPA_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zupa.jks"
          export ZUPA_KEYSTORE_PATH="$RUNNER_TEMP/zupa.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../dist/ZUPA-${VERSION}-signe.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/ZUPA-${VERSION}-playstore.aab"

      - name: APK téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ZUPA-apk
          path: dist/*
          retention-days: 30

      - name: Publication (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
