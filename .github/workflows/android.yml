name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # chaque lundi : pharmacies actualisées + nouvel APK

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZUPA_BUILD: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ZUPA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dépendances
        run: npm ci

      - name: Pharmacies et villes de Côte d'Ivoire (OpenStreetMap)
        run: node scripts/fetch-pharmacies.mjs
        continue-on-error: true

      - name: Enregistrer les données actualisées dans le dépôt
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add www/data/pharmacies.js www/data/villes.js
          if ! git diff --cached --quiet; then
            git config user.name "zupa-bot"
            git config user.email "zupa-bot@users.noreply.github.com"
            git commit -m "Pharmacies et villes : mise à jour OpenStreetMap"
            if git pull --rebase -q -X theirs origin main && git push -q; then echo "Données publiées"; else git rebase --abort 2>/dev/null; echo "Publication impossible : données utilisées pour cet APK seulement"; fi
          fi

      - name: Copier l'application web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/ZUPA-${VERSION}-build${ZUPA_BUILD}.apk"

      - name: Compiler la version signée (si la clé est configurée)
        if: env.KEYSTORE_B64 != ''
        env:
          ZUPA_KEYSTORE_PASSWORD: ${{ secrets.ZUPA_KEYSTORE_PASSWORD }}
          ZUPA_KEY_ALIAS: ${{ secrets.ZUPA_KEY_ALIAS }}
          ZUPA_KEY_PASSWORD: ${{ secrets.ZUPA_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zupa.jks"
          export ZUPA_KEYSTORE_PATH="$RUNNER_TEMP/zupa.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../dist/ZUPA-${VERSION}-signe.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/ZUPA-${VERSION}-playstore.aab"

      - name: Vérification de l'APK
        run: |
          APK=$(ls dist/*-build*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "::notice title=APK::$(basename "$APK") — $(du -h "$APK" | cut -f1)"
          echo "::notice title=Application::$(echo "$BADGE" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion" | tr '\n' ' ')"
          echo "::notice title=Permissions::$(echo "$BADGE" | grep uses-permission | sed "s/uses-permission: name=//" | tr '\n' ' ')"
          echo "::notice title=Contenu web::$(unzip -l "$APK" | grep -c 'assets/public/') fichiers ; $(unzip -l "$APK" | grep -E 'assets/public/(index.html|data/bus.js|data/pharmacies.js|data/gardes.json)' | awk '{print $4"="$1}' | tr '\n' ' ')"
          N=$(node -e "global.window={};require('vm').runInThisContext(require('fs').readFileSync('www/data/pharmacies.js','utf8'));const p=window.ZUPA_PHARMA;console.log(p.list.length+' pharmacies (base du '+p.updated+'), '+p.list.filter(x=>x.phone).length+' avec téléphone, '+p.list.filter(x=>x.hours).length+' avec horaires')")
          echo "::notice title=Pharmacies::$N"
          { echo "## ZUPA"; echo "- $(basename "$APK")"; echo "- $N"; } >> "$GITHUB_STEP_SUMMARY"

      - name: APK téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v5
        with:
          name: ZUPA-apk
          path: dist/*
          retention-days: 30

      - name: Publication dans « Releases » (APK de la version en cours)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp dist/ZUPA-*-build*.apk "release/ZUPA-${VERSION}.apk"
          [ -f "dist/ZUPA-${VERSION}-signe.apk" ] && cp "dist/ZUPA-${VERSION}-signe.apk" "dist/ZUPA-${VERSION}-playstore.aab" release/ || true
          NOTES="ZUPA ${VERSION} — Bouge. Trouve. Vis.

          Installez ZUPA-${VERSION}.apk sur votre téléphone Android (autoriser les sources inconnues).
          Compilation n° ${ZUPA_BUILD} du $(date -u +%d/%m/%Y), commit ${GITHUB_SHA::7}."
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/* --clobber
            gh release edit "v${VERSION}" --notes "$NOTES"
          else
            gh release create "v${VERSION}" release/* --title "ZUPA ${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
