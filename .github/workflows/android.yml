name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # chaque lundi : pharmacies actualisées + nouvel APK

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZUPA_BUILD: ${{ github.run_number }}
      ZUPA_CLE: ${{ secrets.ZUPA_CLE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dépendances
        run: npm ci

      - name: Pharmacies et villes de Côte d'Ivoire (OpenStreetMap)
        run: node scripts/fetch-pharmacies.mjs
        continue-on-error: true

      - name: Lignes de bus, gbaka et wôrô-wôrô (OpenStreetMap)
        run: node scripts/fetch-bus.mjs
        continue-on-error: true

      - name: Enregistrer les données actualisées dans le dépôt
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add www/data/pharmacies.js www/data/villes.js www/data/paiya.js www/data/bus.js www/data/ecoles.js
          if ! git diff --cached --quiet; then
            git config user.name "zupa-bot"
            git config user.email "zupa-bot@users.noreply.github.com"
            git commit -m "Pharmacies et villes : mise à jour OpenStreetMap"
            if git pull --rebase -q -X theirs origin main && git push -q; then echo "Données publiées"; else git rebase --abort 2>/dev/null; echo "Publication impossible : données utilisées pour cet APK seulement"; fi
          fi

      - name: Mois en cours (cache de la carte)
        id: mois
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Carte hors ligne (cache mensuel)
        uses: actions/cache@v4
        with:
          path: www/maps/abidjan.pmtiles
          key: carte-abidjan-${{ steps.mois.outputs.m }}-v1

      - name: Carte hors ligne du Grand Abidjan (Protomaps / OpenStreetMap)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/map-build.sh
          node scripts/map-check.mjs

      - name: Base partagée des lieux (Supabase)
        env:
          SB_URL: ${{ secrets.ZUPA_SUPABASE_URL }}
          SB_KEY: ${{ secrets.ZUPA_SUPABASE_KEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "www/js/config.js";
            let s = fs.readFileSync(f, "utf8");
            const { SB_URL, SB_KEY } = process.env;
            if (SB_URL && SB_KEY) {
              s = s.replace(/supabaseUrl: \x27\x27/, "supabaseUrl: " + JSON.stringify(SB_URL.trim()))
                   .replace(/supabaseKey: \x27\x27/, "supabaseKey: " + JSON.stringify(SB_KEY.trim()));
              fs.writeFileSync(f, s);
            }
            const on = /supabaseUrl: ["\x27]https:/.test(s) && !/supabaseKey: \x27\x27/.test(s);
            console.log("::notice title=Base partagée des lieux::" + (on ? "configurée : les lieux ajoutés sont partagés" : "non configurée : les lieux restent sur le téléphone (voir supabase/LISEZMOI.md)"));
          '
          node scripts/supabase-check.mjs || true

      - name: Copier l'application web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/ZUPA-${VERSION}-build${ZUPA_BUILD}.apk"

      - name: Compiler la version signée (clé stable : les mises à jour gardent les données)
        if: env.ZUPA_CLE != ''
        working-directory: android
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signature/zupa-release.jks.enc -out "$RUNNER_TEMP/zupa.jks" -pass env:ZUPA_CLE
          export ZUPA_KEYSTORE_PATH="$RUNNER_TEMP/zupa.jks" ZUPA_KEYSTORE_PASSWORD="$ZUPA_CLE" ZUPA_KEY_ALIAS=zupa ZUPA_KEY_PASSWORD="$ZUPA_CLE"
          ./gradlew assembleRelease bundleRelease --no-daemon
          VERSION=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "../dist/ZUPA-${VERSION}-signe.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/ZUPA-${VERSION}-playstore.aab"
          rm -f "$RUNNER_TEMP/zupa.jks"
          echo "::notice title=Signature::APK signé avec la clé ZUPA stable — mises à jour sans désinstaller"

      - name: Avertissement signature
        if: env.ZUPA_CLE == ''
        run: echo "::warning title=Signature::Secret ZUPA_CLE absent — APK signé avec une clé de test qui change à chaque compilation (désinstallation obligatoire, données perdues)."

      - name: Vérification de l'APK
        run: |
          APK=$(ls dist/*-build*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "::notice title=APK::$(basename "$APK") — $(du -h "$APK" | cut -f1)"
          echo "::notice title=Application::$(echo "$BADGE" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion" | tr '\n' ' ')"
          echo "::notice title=Permissions::$(echo "$BADGE" | grep uses-permission | sed "s/uses-permission: name=//" | tr '\n' ' ')"
          echo "::notice title=Contenu web::$(unzip -l "$APK" | grep -c 'assets/public/') fichiers ; $(unzip -l "$APK" | grep -E 'assets/public/(index.html|data/bus.js|data/pharmacies.js|data/gardes.json)' | awk '{print $4"="$1}' | tr '\n' ' ')"
          N=$(node -e "global.window={};require('vm').runInThisContext(require('fs').readFileSync('www/data/pharmacies.js','utf8'));const p=window.ZUPA_PHARMA;console.log(p.list.length+' pharmacies (base du '+p.updated+'), '+p.list.filter(x=>x.phone).length+' avec téléphone, '+p.list.filter(x=>x.hours).length+' avec horaires')")
          echo "::notice title=Pharmacies::$N"
          { echo "## ZUPA"; echo "- $(basename "$APK")"; echo "- $N"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Aperçu de la carte hors ligne
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          CHROME_PATH=$(which google-chrome || which chromium || which chromium-browser) node scripts/map-preview.mjs
          gh release view apercus >/dev/null 2>&1 || gh release create apercus --prerelease --title "Aperçus (compilation)" --notes "Captures automatiques de vérification, pas une version de l'application." --target "$GITHUB_SHA"
          gh release upload apercus dist/apercu-carte-*.png --clobber

      - name: APK téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v5
        with:
          name: ZUPA-apk
          path: dist/*
          retention-days: 30

      - name: Publication dans « Releases » (APK de la version en cours)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          if [ -f "dist/ZUPA-${VERSION}-signe.apk" ]; then
            cp "dist/ZUPA-${VERSION}-signe.apk" "release/ZUPA-${VERSION}.apk"
            cp "dist/ZUPA-${VERSION}-playstore.aab" release/
          else
            cp dist/ZUPA-*-build*.apk "release/ZUPA-${VERSION}.apk"
          fi
          NOTES="ZUPA ${VERSION} — Bouge. Trouve. Vis.

          Installez ZUPA-${VERSION}.apk sur votre téléphone Android (autoriser les sources inconnues).
          Compilation n° ${ZUPA_BUILD} du $(date -u +%d/%m/%Y), commit ${GITHUB_SHA::7}."
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release/* --clobber
            gh release edit "v${VERSION}" --notes "$NOTES"
          else
            gh release create "v${VERSION}" release/* --title "ZUPA ${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
